name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudaegis
          POSTGRES_PASSWORD: cloudaegis
          POSTGRES_DB: cloudaegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudaegis" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://cloudaegis:cloudaegis@localhost:5432/cloudaegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r apps/backend/requirements-dev.txt -e packages/security-engine
      - run: python -m pytest -q
      - name: Detection rule docs are up to date
        run: python scripts/generate_rule_docs.py --check
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r apps/backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
