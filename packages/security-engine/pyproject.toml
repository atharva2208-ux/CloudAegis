[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudaegis-engine"
version = "1.0.0"
description = "CloudAegis security engine: provider abstraction, detection rules, compliance mapping and posture scoring"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest>=8", "moto[all]>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudaegis_engine*"]
