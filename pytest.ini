[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: exercises the API and database together
    security: verifies authentication, authorization and abuse protections
    aws: uses moto-mocked AWS APIs
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:moto.*
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
